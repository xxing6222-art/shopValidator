name = "storevalidator"
compatibility_date = "2026-07-23"
workers_dev = false
main = "storevalidator-worker.mjs"

[[routes]]
pattern = "storevalidator.zhangyvjing.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Canonical public routes must reach the Worker before the SPA fallback so
# extensionless demo/share URLs can be redirected to their stable slash form.
run_worker_first = ["/api/*", "/ranking", "/ranking/", "/ranking.html", "/demo", "/case/*"]

[vars]
BACKEND_ORIGIN = "https://shopvalidator.zhangyvjing.com"
